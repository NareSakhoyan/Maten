services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: python:3.12-slim
    profiles: ["fullstack"]
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - redis
    ports:
      - "8000:8000"
    command:
      - bash
      - -lc
      - |
        apt-get update && \
        apt-get install -y --no-install-recommends tesseract-ocr libgl1 libglib2.0-0 && \
        pip install --no-cache-dir -e . && \
        uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    image: python:3.12-slim
    profiles: ["fullstack"]
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - redis
    command:
      - bash
      - -lc
      - |
        apt-get update && \
        apt-get install -y --no-install-recommends tesseract-ocr libgl1 libglib2.0-0 && \
        pip install --no-cache-dir -e . && \
        celery -A app.core.celery_app.celery_app worker -l info

